<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="serv-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#103c6e" flood-opacity="0.2"/>
    </filter>
    <filter id="tool-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- Blue Caddy Gradients -->
    <linearGradient id="caddyFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a77cc"/>
      <stop offset="60%" stop-color="#1d5ca3"/>
      <stop offset="100%" stop-color="#134175"/>
    </linearGradient>
    <linearGradient id="caddySide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c5596"/>
      <stop offset="100%" stop-color="#0e325c"/>
    </linearGradient>
    <linearGradient id="drillBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3182ce"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brushYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e05e"/>
      <stop offset="50%" stop-color="#ecc94b"/>
      <stop offset="100%" stop-color="#d69e2e"/>
    </linearGradient>
    <linearGradient id="sprayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#cbd5e0"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="102" cy="162" rx="72" ry="12" fill="#103c6e" opacity="0.15" />

  <!-- Tools inside caddy -->

  <!-- Yellow Broom / Duster (Right background) -->
  <g transform="rotate(16 150 50)" filter="url(#tool-shadow)">
    <!-- Wooden / metal handle -->
    <rect x="146" y="8" width="6" height="85" rx="3" fill="#a0aec0"/>
    <!-- Yellow Brush head -->
    <path d="M138 22 L160 22 L164 45 L134 45 Z" fill="url(#brushYellow)"/>
    <!-- Bristle lines -->
    <line x1="140" y1="28" x2="137" y2="44" stroke="#b7791f" stroke-width="1.5"/>
    <line x1="145" y1="28" x2="144" y2="44" stroke="#b7791f" stroke-width="1.5"/>
    <line x1="150" y1="28" x2="151" y2="44" stroke="#b7791f" stroke-width="1.5"/>
    <line x1="155" y1="28" x2="158" y2="44" stroke="#b7791f" stroke-width="1.5"/>
  </g>

  <!-- Spray Bottle (Middle) -->
  <g transform="rotate(-8 105 75)" filter="url(#tool-shadow)">
    <!-- Trigger head -->
    <path d="M96 38 L114 38 L116 46 L108 50 L108 58 L100 58 L100 48 Z" fill="#3182ce"/>
    <path d="M96 42 L88 44 L92 48 L98 46 Z" fill="#3182ce"/> <!-- nozzle -->
    <path d="M102 48 Q95 56 102 62" stroke="#e2e8f0" stroke-width="3" fill="none"/> <!-- trigger -->
    <!-- Bottle body -->
    <path d="M98 58 L110 58 L114 85 L94 85 Z" fill="url(#sprayGrad)"/>
    <rect x="95" y="68" width="18" height="12" rx="2" fill="#4299e1" opacity="0.8"/>
  </g>

  <!-- Cordless Power Drill (Left) -->
  <g transform="rotate(-18 68 70)" filter="url(#tool-shadow)">
    <!-- Chuck & Bit -->
    <rect x="78" y="24" width="6" height="16" rx="1.5" fill="#718096"/>
    <rect x="80" y="14" width="2" height="12" fill="#a0aec0"/>
    <!-- Drill Main Housing -->
    <path d="M50 36 C50 32 58 30 78 30 L80 48 C72 50 50 50 50 36 Z" fill="url(#drillBody)"/>
    <!-- Vent slits & rubber grips -->
    <line x1="56" y1="36" x2="56" y2="44" stroke="#4299e1" stroke-width="2"/>
    <line x1="62" y1="36" x2="62" y2="44" stroke="#4299e1" stroke-width="2"/>
    <!-- Handle & Battery Base -->
    <path d="M58 48 L64 80 L76 78 L70 48 Z" fill="#1a202c"/>
    <rect x="58" y="78" width="22" height="12" rx="3" fill="#e53e3e"/> <!-- Red battery pack -->
    <!-- Trigger -->
    <path d="M71 54 Q75 58 71 62" stroke="#e53e3e" stroke-width="3" fill="none"/>
  </g>

  <!-- Blue Tool Caddy / Bucket Container -->
  <g filter="url(#serv-shadow)">
    <!-- Caddy Inner cavity -->
    <ellipse cx="102" cy="85" rx="55" ry="14" fill="#0c2545"/>

    <!-- Central Handle Arch -->
    <path d="M68 85 C68 45 136 45 136 85" stroke="#103866" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M68 85 C68 45 136 45 136 85" stroke="#3182ce" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="90" y="44" width="24" height="8" rx="4" fill="#e2e8f0"/>

    <!-- Caddy Main Tub Body -->
    <path d="M42 85 C42 85 46 150 52 154 C58 158 146 158 152 154 C158 150 162 85 162 85 Z" fill="url(#caddyFront)"/>
    
    <!-- Top Rim Edge -->
    <ellipse cx="102" cy="85" rx="60" ry="11" fill="#4299e1"/>
    <ellipse cx="102" cy="85" rx="57" ry="9" fill="#2b6cb0"/>

    <!-- Front panel ribs / brand embossed line -->
    <path d="M56 105 Q102 115 148 105" stroke="#1a4f8b" stroke-width="3" fill="none"/>
    <path d="M60 125 Q102 135 144 125" stroke="#1a4f8b" stroke-width="3" fill="none"/>
  </g>
</svg>
